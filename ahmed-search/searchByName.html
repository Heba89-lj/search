<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بحث باسم مقدم الطلب</title>
  <style>
    body {
      font-family: "Cairo", sans-serif;
      direction: rtl;
      /* background: linear-gradient(135deg, #f2f6fc, #dce3f0); */
            background: linear-gradient(to bottom right, #0a1f44, #1e3c72, #2a5298);
       min-height: 100vh;

      margin: 0;
      padding: 0;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }

    h1 {
      color: white;
      margin-bottom: 25px;
      font-weight: bold;
    }

    input {
      width: 90%;
      max-width: 300px;
      padding: 10px;
      margin: 5px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
      text-align: right;
    }

    button {
      background: #004aad;
      color: #fff;
      border: none;
      padding: 10px 20px;
      margin-top: 10px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #003580;
    }

    table {
      width: 95%;
      max-width: 800px;
      margin: 20px auto;
      border-collapse: collapse;
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }

    th {
      background: #789ec7;
      color: white;
      padding: 10px;
      width: 35%;
      text-align: right;
    }

    td {
      color: black;
      padding: 10px;
      text-align: right;
      word-break: break-word;
    }

    .prewrap { white-space: pre-wrap; }

    #message {
      margin-top: 20px;
      font-weight: bold;
      color: red;
    }
  </style>
</head>
<body>

<div class="container">
<h1>الاستعلام باسم مقدم الطلب</h1>
  <input type="text" id="name" placeholder="أدخل اسم مقدم الطلب" />
<button onclick="searchData()">بحث</button>

  <div id="result"></div>
  <p id="message"></p>
</div>

<script>

async function searchData() {
  const name = document.getElementById("name").value.trim();
  const resultDiv = document.getElementById("result");
  const message = document.getElementById("message");

  resultDiv.innerHTML = "";
  message.textContent = "";

  if (!name) {
    message.textContent = "من فضلك أدخل اسم مقدم الطلب.";
    return;
  }

  try {
    const res = await fetch(`/api/searchByName?name=${encodeURIComponent(name)}`);
    const data = await res.json();

    if (data.success) {
resultDiv.innerHTML = data.results.map(r => `
<table>
  <tr>
    <th>رقم الفحص</th>
    <td>${r.number || "-"}</td>
  </tr>
  <tr>
    <th>رقم القضية</th>
    <td>${r.caseNumber || "-"}</td>
  </tr>
</table>
<br>
`).join("");

    } else {
      message.textContent = data.message || "لم يتم العثور على بيانات.";
    }

  } catch (err) {
    console.error(err);
    message.textContent = "حدث خطأ أثناء البحث.";
  }
}

</script>

</body>
</html>
